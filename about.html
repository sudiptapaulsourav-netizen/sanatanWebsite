<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Demo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* General Layout */
        .about-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 3rem;
            flex-wrap: wrap;
            padding: 4rem 8vw;
        }

        .about-text {
            flex: 1;
            max-width: 600px;
        }

        .about-images {
            flex: 1;
            position: relative;
        }

        /* Button to trigger image visibility */
        .show-images-btn {
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 1rem;
            background-color: rgba(245, 158, 11, 0.2);
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .show-images-btn:hover {
            background-color: rgba(245, 158, 11, 0.5); /* Change background color on hover */
        }

        /* Initially hidden images */
        .image-box {
            display: none;  /* Hidden by default */
            gap: 1rem;
            flex-direction: column;
            margin-top: 2rem;
            align-items: center;
        }

        /* Image styling */
        .devi-image,
        .dev-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            opacity: 0;  /* Make images invisible initially */
            transition: opacity 0.5s ease, transform 0.5s ease;  /* Smooth transitions for visibility and scale */
        }

        /* When button is hovered, images appear */
        .show-images-btn:hover + .image-box .devi-image,
        .show-images-btn:hover + .image-box .dev-image {
            opacity: 1;  /* Make images visible */
            transform: scale(1.05);  /* Slight zoom effect on hover */
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .about-container {
                flex-direction: column;
                align-items: center;
            }

            .image-box {
                flex-direction: row;
                gap: 0.5rem;
            }

            .devi-image,
            .dev-image {
                width: 150px; /* Adjust size on mobile */
                height: 150px;
            }
        }
    </style>
</head>
<body>

    <section class="about" id="about">
        <div class="section-heading">
            <h2>About Sanatan Dharma</h2>
            <p>Sanatan Dharma is the timeless path of harmony, devotion, and self-realization.</p>
        </div>

        <div class="about-container">
            <!-- Left side (Text) -->
            <div class="about-text">
                <h3>Dharma and Spiritual Wisdom</h3>
                <p>Sanatan Dharma offers wisdom, practices, and sacred rituals that guide spiritual seekers on their path to self-realization.</p>
            </div>

            <!-- Right side (Button and Images) -->
            <div class="about-images">
                <!-- Button that triggers image visibility -->
                <button class="show-images-btn">Hover to see Devi and Dev</button>

                <!-- Hidden images that will appear on hover -->
                <div class="image-box">
                    <img src="https://via.placeholder.com/200x200?text=Devi+1" alt="Devi 1" class="devi-image">
                    <img src="https://via.placeholder.com/200x200?text=Dev+1" alt="Dev 1" class="dev-image">
                    <img src="https://via.placeholder.com/200x200?text=Devi+2" alt="Devi 2" class="devi-image">
                    <img src="https://via.placeholder.com/200x200?text=Dev+2" alt="Dev 2" class="dev-image">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
